server {
    # Listen on port 8080, the default for Google Cloud Run
    listen 8080;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # This is crucial for single-page applications like React
        try_files $uri /index.html;
    }

    # Proxy API requests to the backend container (same origin, no CORS issues).
    # The service name "server" comes from docker-compose.yml.
    location /api {
        proxy_pass http://server:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}
